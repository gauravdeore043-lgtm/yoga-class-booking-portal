# Target node for the Yoga Class Booking Portal.
# The "server" is a clean Ubuntu 24.04 container created by scripts/provision-node.sh
# and reached through Docker's exec API (no SSH needed). For a real VM, replace the
# connection vars with: ansible_host=<ip> ansible_user=<user> ansible_connection=ssh
[yoga_nodes]
yoga-node ansible_connection=community.docker.docker ansible_host=yoga-node

[yoga_nodes:vars]
ansible_python_interpreter=/usr/bin/python3
