spring.application.name=yoga-portal

# Environment label. Overridden per deployment:
#  - Tomcat: <Parameter name="app.environment"> in the context descriptor written by the Jenkins pipeline
#  - Docker / Ansible: APP_ENVIRONMENT variable or config file
app.environment=local

# In-memory H2 database (MVP). Schema is generated from the JPA entities.
# No fixed URL: Spring Boot gives every application context its own uniquely named
# in-memory database, so test contexts (unit + Selenium) never share or drop each other's tables.
spring.datasource.generate-unique-name=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Operations endpoints used for health checks by Jenkins, Docker and Ansible
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

server.servlet.session.timeout=30m
