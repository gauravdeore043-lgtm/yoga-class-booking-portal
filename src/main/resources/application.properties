spring.application.name=yoga-portal

# Environment label. Overridden per deployment:
#  - Tomcat: JNDI <Environment name="app.environment"> written by the Jenkins pipeline
#  - Docker / Ansible: APP_ENVIRONMENT variable or config file
app.environment=local

# In-memory H2 database (MVP). Schema is generated from the JPA entities.
spring.datasource.url=jdbc:h2:mem:yogadb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Operations endpoints used for health checks by Jenkins, Docker and Ansible
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

server.servlet.session.timeout=30m
