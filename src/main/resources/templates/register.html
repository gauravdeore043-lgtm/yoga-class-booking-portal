<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <h1>Become a member</h1>
    <p class="lead">One quick form, and you can book any class with free seats.</p>

    <div class="grid-2">
        <section class="card">
            <h2>New member</h2>
            <form id="register-form" th:action="@{/register}" th:object="${form}" method="post" novalidate>
                <div class="form-row">
                    <label for="name">Full name</label>
                    <input type="text" id="name" th:field="*{name}" autocomplete="name">
                    <div class="field-error" id="name-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>
                <div class="form-row">
                    <label for="email">Email</label>
                    <input type="email" id="email" th:field="*{email}" autocomplete="email">
                    <div class="field-error" id="email-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                </div>
                <div class="form-row">
                    <label for="phone">Phone</label>
                    <input type="tel" id="phone" th:field="*{phone}" autocomplete="tel">
                    <div class="field-error" id="phone-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                </div>
                <button type="submit" class="btn btn-primary" id="register-submit">Create account</button>
            </form>
        </section>

        <section class="card">
            <h2>Already a member?</h2>
            <p class="muted">Sign in with the email you registered with.</p>
            <form id="login-form" th:action="@{/login}" method="post">
                <div class="form-row">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required autocomplete="email">
                </div>
                <button type="submit" class="btn btn-ghost" id="login-submit">Sign in</button>
            </form>
        </section>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
